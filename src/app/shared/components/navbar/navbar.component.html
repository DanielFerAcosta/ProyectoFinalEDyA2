<header
  class="navbar"
  (keydown.escape)="closeMenu()"
>
  <div class="container navbar__container">
    <a
      class="brand"
      routerLink="/"
      aria-label="Entrena, inicio"
      (click)="closeMenu()"
    >
      <span class="brand__icon" aria-hidden="true">
        E
      </span>

      <span>
        entrena<span class="brand__accent">.</span>
      </span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      aria-controls="main-navigation"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      {{ menuOpen() ? 'Cerrar menú' : 'Abrir menú' }}
    </button>

    <nav
      id="main-navigation"
      class="navigation"
      aria-label="Navegación principal"
      [class.navigation--open]="menuOpen()"
    >
      <a
        class="navigation__link"
        routerLink="/"
        (click)="closeMenu()"
      >
        Inicio
      </a>

      <a
        class="navigation__link"
        href="#funcionalidades"
        (click)="closeMenu()"
      >
        Funcionalidades
      </a>

      <a
        class="navigation__link"
        href="#como-funciona"
        (click)="closeMenu()"
      >
        Cómo funciona
      </a>
    </nav>
  </div>
</header>
